name: Build site

on:
  push:
  workflow_dispatch:
    inputs:
      spec_tag:
        description: "egatari-spec tag to build the specification from"
        required: false
        default: "wd-2026-11-10"

permissions:
  contents: read
  # Read-only for the build: jekyll-github-metadata's Pages lookup (triggered by
  # jekyll-relative-links while rendering egatari-spec) needs it. Only the
  # deploy job below, on main, gets write access.
  pages: read

env:
  SPEC_TAG: ${{ github.event.inputs.spec_tag || 'wd-2026-11-10' }}
  # Egatari Studio commit whose glossary (docs/terms.json) and lint-terms.mjs check
  # the site's wording. Move to the v0.6.11 tag once it exists.
  STUDIO_TERMS_SHA: 6ec281553b4c93a992de306e410f7ed20cf66805

jobs:
  terms:
    # The site's words follow Egatari Studio's glossary (バージョン, ツール, サンプル, Egatari Studio, ...).
    runs-on: ubuntu-latest
    steps:
      - name: Check out egatari.org (this repo)
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out egatari-studio at the pinned glossary commit
        uses: actions/checkout@v4
        with:
          repository: egatari/egatari-studio
          ref: ${{ env.STUDIO_TERMS_SHA }}
          path: studio

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the site's wording against the glossary (site-specific exceptions in tools/terms-allow.site.json)
        working-directory: studio
        run: node tools/lint-terms.mjs --prose ../site/src --exclude 'gallery/play/site-play.js' --allow ../site/tools/terms-allow.site.json

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out egatari.org (this repo)
        uses: actions/checkout@v4

      - name: Check out egatari-spec at ${{ env.SPEC_TAG }}
        uses: actions/checkout@v4
        with:
          repository: egatari/egatari-spec
          ref: ${{ env.SPEC_TAG }}
          path: spec-src

      - name: Build the spec alone (same Jekyll build GitHub Pages uses)
        uses: actions/jekyll-build-pages@v1
        with:
          source: spec-src
          destination: spec-site

      - name: Assemble egatari.org (spec moves to /spec/, add landing + robots.txt)
        run: |
          set -eu
          OUT="_site"
          rm -rf "${OUT:?}"
          mkdir -p "$OUT"
          # The overlay (src/) may add paths but never overwrite a spec path,
          # except index.html (the spec front page moves to /spec/).
          python3 tools/compare-urls.py --check-overlay spec-site src
          cp -R spec-site/. "$OUT"/
          mkdir -p "$OUT/spec"
          mv "$OUT/index.html" "$OUT/spec/index.html"
          cp -R src/. "$OUT"/

      - name: Prove the new build serves every spec URL the old build does
        run: python3 tools/compare-urls.py spec-site _site src

      - name: Fetch the sample lessons pinned by src/gallery/samples.lock.json (checked byte for byte; written as /gallery/files/<id>.ega.bin)
        run: python3 tools/gallery_files.py fetch _site

      - name: Set up Node for the gallery player check
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check /gallery/play/ in the assembled site (the vendored player, its policy, every lesson, the refusals)
        run: |
          npm ci --ignore-scripts
          npx playwright-core install --with-deps chromium
          node tools/test-gallery-play.mjs _site

      - name: Upload assembled site as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: egatari-org-site
          path: _site
          if-no-files-found: error

      - name: Upload the site for GitHub Pages (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # egatari.org is served from here since the cutover (handoff/site-repo-2026-11-11.md, step 4).
    if: github.ref == 'refs/heads/main'
    needs: [build, terms]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
